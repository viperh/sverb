# M7-07: release-plz (SPEC §20). https://release-plz.dev/docs/config
#
# Used only to PREPARE releases: every push to `master` (re)opens a release PR that bumps
# the version of every crate together (they share `workspace.package.version`) and adds
# the conventional-commit changelog to CHANGELOG.md. release-plz never tags, publishes or
# creates GitHub releases here (.github/workflows/release-plz.yml runs only `release-pr`).
# A release is made by pushing a tag `vX.Y.Z` after merging the release PR; the tag starts
# .github/workflows/cd.yml (binaries, image, package channels).
#
# The sync protocol is versioned separately (`/v1`, `Sverb-Proto: 1`; SPEC §20) and is
# not touched by these version bumps.

[workspace]
# One changelog for the project (the `sverb` package below), not one per crate.
changelog_update = false
# Only `sverb` gets a tag and a GitHub release.
git_tag_enable = false
git_release_enable = false
# The library crates are implementation details of the binary; their API is not a
# stability promise (the CLI, config.toml and the sync protocol are), so
# cargo-semver-checks would only force needless major bumps.
semver_check = false
# Don't bump dependencies in Cargo.lock in the release PR (Cargo.lock is pinned; see
# CONTRIBUTING.md for dependency updates).
dependencies_update = false
pr_labels = ["release"]
publish_timeout = "30m"

# The changelog format (git-cliff templates), keeping CHANGELOG.md in the "Keep a
# Changelog" layout: `## [X.Y.Z] - YYYY-MM-DD`, one section per kind of change.
# Conventional commits: feat, fix, sec, perf, refactor, docs, revert; build/ci/chore/
# style/test commits are left out.
[changelog]
header = """
# Changelog

All notable changes to sverb are recorded here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project uses
[Semantic Versioning](https://semver.org/) for the CLI, `config.toml` and the vault format;
the sync protocol is versioned separately (`/v1`, `Sverb-Proto: 1`).
"""
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking**){% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^sec", group = "security" },
    { message = "^perf", group = "changed" },
    { message = "^refactor", group = "changed" },
    { message = "^docs", group = "documentation" },
    { message = "^revert", group = "removed" },
    { message = "^(build|ci|chore|style|test)", skip = true },
    { message = ".*", group = "other" },
]

[[package]]
name = "sverb"
changelog_update = true
changelog_path = "CHANGELOG.md"
# Commits touching any published crate belong in the one changelog.
changelog_include = [
    "sverb-conn",
    "sverb-core",
    "sverb-crypto",
    "sverb-proto",
    "sverb-server",
    "sverb-store",
    "sverb-sync",
    "sverb-term",
    "sverb-tui",
]
git_tag_enable = false  # tags are pushed by hand
git_tag_name = "v{{ version }}"
git_release_enable = false  # cd.yml creates the release from the tag
git_release_name = "sverb v{{ version }}"
version_group = "sverb"

[[package]]
name = "sverb-conn"
version_group = "sverb"

[[package]]
name = "sverb-core"
version_group = "sverb"

[[package]]
name = "sverb-crypto"
version_group = "sverb"

[[package]]
name = "sverb-proto"
version_group = "sverb"

[[package]]
name = "sverb-server"
version_group = "sverb"

[[package]]
name = "sverb-store"
version_group = "sverb"

[[package]]
name = "sverb-sync"
version_group = "sverb"

[[package]]
name = "sverb-term"
version_group = "sverb"

[[package]]
name = "sverb-tui"
version_group = "sverb"

# Docker-based tests; `publish = false` in its Cargo.toml.
[[package]]
name = "sverb-e2e"
release = false
