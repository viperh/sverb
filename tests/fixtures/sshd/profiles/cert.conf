# M1-18 profile `cert` (M1-14/15): user certificates signed by the test user CA
# (keys/user_ca, principal `test`), and a host certificate signed by the test host CA
# (keys/host_ca; signed at start by the entrypoint).
PasswordAuthentication no
AuthenticationMethods publickey
TrustedUserCAKeys /etc/ssh/user_ca.pub
HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
