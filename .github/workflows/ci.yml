name: CI # Continuous Integration

# SPEC §19 (CI), §17 (supply chain), §1.1 (local-only build), §20 (license policy).

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # vergen-gix (crates/sverb/build.rs) needs history and tags
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (local-only build, SPEC §1.1)
        run: cargo clippy -p sverb -p sverb-tui --all-targets --no-default-features --locked -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features --workspace --locked

  bench-build:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build benchmarks
        run: cargo bench --workspace --no-run --locked
      - name: Gate script self-test
        run: python3 scripts/bench-gate.py self-test

  test-local-only:
    name: Test (local-only build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests without default features (SPEC §1.1)
        env:
          SVERB_HOME: ${{ runner.temp }}/sverb-home # `runner` is only available at step level
        run: >-
          cargo test --workspace --no-default-features --locked
          --exclude sverb-sync --exclude sverb-server --exclude sverb-e2e

  # The docker-based OpenSSH e2e suite (SPEC §19 "Transports (e2e)").
  # Required check (set in branch protection). The fixture image is built once per
  # run with layer caching (GitHub Actions cache) and handed to the harness through
  # SVERB_E2E_IMAGE; the `#[ignore]`d container tests run with `-- --ignored`.
  e2e:
    name: E2E (docker)
    runs-on: ubuntu-latest
    env:
      SVERB_E2E: "1"
      SVERB_E2E_IMAGE: sverb-e2e-sshd:ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Docker info
        run: docker info
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the OpenSSH fixture image
        uses: docker/build-push-action@v7
        with:
          context: tests/fixtures/sshd
          tags: ${{ env.SVERB_E2E_IMAGE }}
          load: true
          cache-from: type=gha,scope=sverb-e2e-sshd
          cache-to: type=gha,mode=max,scope=sverb-e2e-sshd
      - name: Validate every sshd profile in the image
        run: |
          for p in password key cert kbd maxauth2 legacy env forward jump windows-like; do
            docker run --rm -e SSHD_PROFILE="$p" "$SVERB_E2E_IMAGE" --check
          done
      # PtyApp drives the real binary; build it up front (the harness would otherwise
      # build it on first use).
      - name: Build sverb
        run: cargo build -p sverb --locked
      - name: Run e2e tests
        run: cargo test -p sverb-e2e --locked --no-fail-fast -- --ignored --test-threads=4
      - name: Leftover containers
        if: failure()
        run: docker ps -a

  # Sverb-server tests against a real Postgres. Each DB test creates and
  # drops its own database (the POSTGRES_USER role is a superuser here); without
  # DATABASE_URL those tests skip, so this job is the one that exercises them.
  server-db:
    name: Server (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sverb
          POSTGRES_PASSWORD: sverb
          POSTGRES_DB: sverb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sverb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sverb:sverb@localhost:5432/sverb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run server tests
        run: cargo test -p sverb-server --locked

  # Build the server image, bring up the compose stack, wait for
  # /healthz and check that the container does not run as root.
  server-docker:
    name: Server (docker compose)
    runs-on: ubuntu-latest
    env:
      SVERB_SERVER_SECRET: c1c1c1c1000102030405060708090a0b0c0d0e0f101112131415161718191a1b  # CI-only test value (hex, 32 bytes)
      SVERB_PUBLIC_URL: http://localhost:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build and start
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for /healthz (60 s)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: Ready and logged a setup token
        run: |
          curl -fsS http://localhost:8080/readyz
          docker compose -f deploy/docker-compose.yml logs sverb-server | grep -q setup_token
      - name: Runs as non-root
        run: |
          user="$(docker inspect --format '{{.Config.User}}' sverb-server:local)"
          echo "image user: $user"
          case "$user" in ""|root|0|0:0|root:root) exit 1;; esac
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check advisories, bans, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features --locked

  vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet
      - name: Vet dependencies
        run: cargo vet --locked
      # SPEC §17: Appendix A crypto crates need a real audit, never an exemption.
      - name: Crypto crates (warns while they are exempted)
        run: python3 scripts/check-vet-crypto.py

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install stable toolchain (for cargo metadata)
        uses: dtolnay/rust-toolchain@stable
      # The MSRV lives only in `[workspace.package] rust-version`; read it from there.
      - name: Read rust-version
        id: msrv
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '[.packages[].rust_version // empty] | unique
                     | if length == 1 then .[0]
                       else error("workspace crates disagree on rust-version: \(.)") end')"
          echo "MSRV is $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      # `+toolchain` overrides rust-toolchain.toml (channel = "stable").
      - name: Check on MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features --locked

  layering:
    name: Crate layering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace metadata and layering test
        run: cargo test -p sverb-e2e --test workspace_metadata --locked
      # Independent second implementation of the same rules, over the
      # all-features and local-only (no-default-features) graphs.
      - name: Check dependency direction (script)
        run: python3 scripts/check-layering.py

  # (process hardening, Windows agent pipe DACL); the workspace lint is `deny`.
  unsafe-check:
    name: unsafe confinement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: allow(unsafe_code) only in the allowed modules
        run: python3 scripts/check-unsafe.py

  # every temp dir kept under one root, then a scan of all logs, crash reports, SQLite
  # files, recordings, backups and the server database for the planted canaries
  # (CONTRIBUTING.md, "Canary secrets").
  canary:
    name: Canary scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sverb
          POSTGRES_PASSWORD: sverb
          POSTGRES_DB: sverb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sverb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SVERB_LOG: trace
      SVERB_KEYRING: "off"
      DATABASE_URL: postgres://sverb:sverb@localhost:5432/sverb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scanner self-test
        run: scripts/canary-scan.sh --self-test
      - name: Prepare the artifact root
        run: mkdir -p "$RUNNER_TEMP/canary/tmp" "$RUNNER_TEMP/canary/home"
      - name: Run the test suite at trace level
        env:
          TMPDIR: ${{ runner.temp }}/canary/tmp
          SVERB_HOME: ${{ runner.temp }}/canary/home
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: Dump the server database
        if: always()
        env:
          PGPASSWORD: sverb
        run: >-
          pg_dumpall -h localhost -U sverb > "$RUNNER_TEMP/canary/tmp/server-dump.sql"
          || echo "pg_dumpall unavailable; server dump not scanned"
      - name: Scan for canaries
        if: always()
        run: >-
          scripts/canary-scan.sh --require-files
          target/tmp "$RUNNER_TEMP/canary/tmp" "$RUNNER_TEMP/canary/home"

  # without a crash. The nightly 10-minute runs are in fuzz.yml.
  fuzz:
    name: Fuzz (30 s per target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Seed corpus
        run: fuzz/seed-corpus.sh
      - name: Build every target
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
      - name: Run every target for 30 s
        run: |
          status=0
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            if ! cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" "fuzz/corpus/$target" -- \
                 -max_total_time=30 -rss_limit_mb=2048 -timeout=10; then
              echo "::error::fuzz target $target crashed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore

  # The Nix flake builds the client (SPEC §20).
  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check --no-build
      - name: nix build .#sverb
        run: |
          nix build .#sverb -L
          ./result/bin/sverb --version
          test -f result/share/man/man1/sverb.1.gz
          test -f result/share/bash-completion/completions/sverb.bash

  # Release tooling that needs no secrets (the full release dry run is
  # `workflow_dispatch` of cd.yml).
  packaging:
    name: Packaging files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Channel files update (self-test)
        run: python3 scripts/update-packaging.py --self-test
      - name: Syntax of the channel files
        run: |
          bash -n packaging/aur/sverb/PKGBUILD
          bash -n packaging/aur/sverb-bin/PKGBUILD
          ruby -c packaging/homebrew/sverb.rb
          jq -e . packaging/scoop/sverb.json >/dev/null
      - name: Archives are reproducible
        run: |
          export SVERB_HOME="$RUNNER_TEMP/home" SVERB_KEYRING=off
          cargo build --locked -p sverb
          mkdir -p assets/man assets/completions
          target/debug/sverb generate man --out-dir assets/man
          target/debug/sverb generate completions bash >assets/completions/sverb.bash
          for i in 1 2; do
            scripts/release-package.sh sverb 0.0.0 linux-x86_64 target/debug/sverb "out$i" assets
          done
          cmp out1/sverb-0.0.0-linux-x86_64.tar.gz out2/sverb-0.0.0-linux-x86_64.tar.gz
          (cd out1 && sha256sum -c ./*.sha256)
      - name: crates package (cargo install sverb)
        run: cargo package --workspace --exclude sverb-e2e --locked
