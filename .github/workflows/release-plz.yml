name: Release-plz

# Release PREPARATION only (SPEC §20; configuration in release-plz.toml):
#   - every push to master opens or updates a release PR that bumps the version of every
#     crate together and adds the conventional-commit section to CHANGELOG.md.
# It never tags, publishes or creates a GitHub release. Releases are made only by pushing
# a tag `vX.Y.Z` yourself (after merging the release PR), which starts cd.yml:
#   git tag v1.0.0 && git push origin v1.0.0
# Secret (optional): RELEASE_PLZ_TOKEN, a PAT with contents + pull-requests write, so CI
# runs on the release PR; without it the default GITHUB_TOKEN opens the PR.

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Release PR
    if: github.repository == 'viperh/sverb'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
