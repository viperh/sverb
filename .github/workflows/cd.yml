name: CD # Continuous Deployment

# tag `vX.Y.Z` (e.g. `git tag v1.0.0 && git push origin v1.0.0`); the tag must match
# `workspace.package.version` in Cargo.toml. The tag builds and publishes:
#   - sverb-<v>-linux-{x86_64,aarch64}.tar.gz      static musl client
#   - sverb-<v>-macos-universal.tar.gz              lipo of x86_64 + aarch64
#   - sverb-<v>-windows-x86_64.zip
#   - sverb-server-<v>-linux-{x86_64,aarch64}.tar.gz static musl server
#   - SHA256SUMS, one .sha256 per archive, an SBOM (CycloneDX)
#   - ghcr.io/<owner>/sverb-server:<v> and :latest (linux/amd64 + linux/arm64)
#   - the AUR (sverb, sverb-bin), Homebrew tap and Scoop bucket updates
# Every archive holds the man page and shell completions (`sverb generate`).
#
# `workflow_dispatch` (Actions tab, "Run workflow") is always a dry run: every build and
# check (T-01 static/universal, T-02 reproducibility, T-04 image smoke test) runs and the
# artifacts are uploaded to the run; nothing is published.
#
# Secrets (all optional except GITHUB_TOKEN; a missing one skips its channel):
#   AUR_SSH_PRIVATE_KEY, HOMEBREW_TAP_TOKEN, SCOOP_BUCKET_TOKEN,
#   APPLE_CERTIFICATE_P12 / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
#   APPLE_NOTARY_KEY / APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER (macOS signing and
#   notarization; without them the binary is unsigned, see docs/faq.md "Gatekeeper").

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Manual runs are dry runs only (see `meta`): releases come from tags.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      source-date-epoch: ${{ steps.meta.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        name: Version, publish flag, SOURCE_DATE_EPOCH
        run: |
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $cargo_version"
              exit 1
            fi
            publish=true
          else
            # Not a tag (a manual run): never publish.
            version="$cargo_version"
            publish=false
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "source-date-epoch=$(git log -1 --format=%ct)"
          } >>"$GITHUB_OUTPUT"
          echo "version $version, publish $publish"

  assets:
    name: Man page and completions
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate (T-05)
        run: |
          export SVERB_HOME="$RUNNER_TEMP/sverb-home" SVERB_KEYRING=off
          cargo build --locked -p sverb
          bin=target/debug/sverb
          mkdir -p assets/man assets/completions
          "$bin" generate man --out-dir assets/man
          "$bin" generate completions bash >assets/completions/sverb.bash
          "$bin" generate completions zsh >assets/completions/_sverb
          "$bin" generate completions fish >assets/completions/sverb.fish
          "$bin" generate completions powershell >assets/completions/_sverb.ps1
          bash -n assets/completions/sverb.bash
          sudo apt-get install -y --no-install-recommends groff-base >/dev/null
          groff -man -ww -z assets/man/sverb.1
      - uses: actions/upload-artifact@v4
        with:
          name: sverb-assets
          path: assets

  linux:
    name: Linux ${{ matrix.arch }} (musl)
    needs: [meta, assets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            cross: true
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # vergen stamps `git describe`
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: ${{ !matrix.cross }}
        run: sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build (reproducible flags)
        run: |
          # §17: --locked, SOURCE_DATE_EPOCH, stripped, paths remapped so the checkout
          # location and the cargo home don't end up in the binary.
          export RUSTFLAGS="-C target-feature=+crt-static -C strip=symbols --remap-path-prefix=$GITHUB_WORKSPACE=/build/sverb --remap-path-prefix=$HOME/.cargo=/cargo"
          tool=cargo
          if [[ "${{ matrix.cross }}" == true ]]; then tool=cross; fi
          "$tool" build --locked --release -p sverb -p sverb-server --target ${{ matrix.target }}
      - name: Static binaries (T-01)
        run: |
          for b in sverb sverb-server; do
            f="target/${{ matrix.target }}/release/$b"
            file "$f"
            file "$f" | grep -Eq 'statically linked|static-pie linked' || { echo "::error::$b is not static"; exit 1; }
          done
      - name: Reproducible (T-02)
        if: ${{ !matrix.cross }}
        run: |
          # A second, independent build from another directory must be byte-identical.
          other="$RUNNER_TEMP/rebuild"
          git worktree add --detach "$other" HEAD
          (
            cd "$other"
            export RUSTFLAGS="-C target-feature=+crt-static -C strip=symbols --remap-path-prefix=$other=/build/sverb --remap-path-prefix=$HOME/.cargo=/cargo"
            CARGO_TARGET_DIR="$RUNNER_TEMP/rebuild-target" cargo build --locked --release -p sverb -p sverb-server --target ${{ matrix.target }}
          )
          for b in sverb sverb-server; do
            a="target/${{ matrix.target }}/release/$b"
            b2="$RUNNER_TEMP/rebuild-target/${{ matrix.target }}/release/$b"
            sha256sum "$a" "$b2"
            cmp "$a" "$b2" || { echo "::error::$b is not reproducible"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          name: sverb-assets
          path: assets
      - name: Package
        run: |
          r="target/${{ matrix.target }}/release"
          scripts/release-package.sh sverb "$VERSION" linux-${{ matrix.arch }} "$r/sverb" dist assets
          scripts/release-package.sh sverb-server "$VERSION" linux-${{ matrix.arch }} "$r/sverb-server" dist
          # The bare server binary for the image build.
          mkdir -p image
          arch=$([[ ${{ matrix.arch }} == x86_64 ]] && echo amd64 || echo arm64)
          install -m 0755 "$r/sverb-server" "image/sverb-server-$arch"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: image-linux-${{ matrix.arch }}
          path: image

  macos:
    name: macOS universal
    needs: [meta, assets]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build both architectures
        run: |
          export RUSTFLAGS="-C strip=symbols --remap-path-prefix=$GITHUB_WORKSPACE=/build/sverb --remap-path-prefix=$HOME/.cargo=/cargo"
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release -p sverb --target "$t"
          done
      - name: lipo (T-01)
        run: |
          mkdir -p universal
          lipo -create -output universal/sverb \
            target/x86_64-apple-darwin/release/sverb \
            target/aarch64-apple-darwin/release/sverb
          lipo -info universal/sverb
          lipo -info universal/sverb | grep -q x86_64
          lipo -info universal/sverb | grep -q arm64
      - name: Sign and notarize (when the secrets exist)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "::notice::no signing certificate; the macOS binary is unsigned (docs/faq.md, Gatekeeper)"
            exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$kc"
          security default-keychain -s "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" >/dev/null
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" universal/sverb
          codesign --verify --verbose universal/sverb
          if [[ -n "$APPLE_NOTARY_KEY" ]]; then
            echo "$APPLE_NOTARY_KEY" >"$RUNNER_TEMP/notary.p8"
            ditto -c -k universal/sverb "$RUNNER_TEMP/sverb.zip"
            xcrun notarytool submit "$RUNNER_TEMP/sverb.zip" --wait \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: sverb-assets
          path: assets
      - name: Package
        run: |
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          scripts/release-package.sh sverb "$VERSION" macos-universal universal/sverb dist assets
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-universal
          path: dist

  windows:
    name: Windows x86_64
    needs: [meta, assets]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --locked --release -p sverb --target x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v4
        with:
          name: sverb-assets
          path: assets
      - name: Package
        run: |
          scripts/release-package.sh sverb "$VERSION" windows-x86_64 \
            target/x86_64-pc-windows-msvc/release/sverb.exe dist assets
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist

  image:
    name: Server image (amd64 + arm64)
    needs: [meta, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/sverb-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-linux-*
          merge-multiple: true
          path: ctx/dist
      - name: Context
        run: |
          chmod 0755 ctx/dist/*
          ls -l ctx/dist
          cp deploy/Dockerfile.server.release ctx/Dockerfile
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Smoke test each architecture (T-04)
        env:
          SVERB_SERVER_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          SVERB_PUBLIC_URL: http://localhost:8080
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg VERSION="$VERSION" -t sverb-server:local ctx
            docker run --rm --platform "linux/$arch" sverb-server:local --version | grep -F "$VERSION"
            # The compose stack with this image must report healthy.
            DOCKER_DEFAULT_PLATFORM="linux/$arch" \
              docker compose -f deploy/docker-compose.yml up -d --no-build
            ok=false
            for i in $(seq 1 120); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f deploy/docker-compose.yml ps -q sverb-server)")"
              if [[ "$status" == healthy ]]; then ok=true; break; fi
              sleep 2
            done
            docker compose -f deploy/docker-compose.yml logs sverb-server | tail -20
            docker compose -f deploy/docker-compose.yml down -v
            $ok || { echo "::error::$arch container never became healthy"; exit 1; }
          done
      - name: Log in to ghcr.io
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: needs.meta.outputs.publish == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" ctx

  release:
    name: GitHub release
    needs: [meta, linux, macos, windows, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SBOM (CycloneDX)
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Write the SBOM and SHA256SUMS
        run: |
          if command -v cargo-cyclonedx >/dev/null; then
            cargo cyclonedx --format json --target all -p sverb --override-filename "sverb-$VERSION.cdx" || true
            find crates/sverb -name "sverb-$VERSION.cdx.json" -exec mv {} dist/ \;
          fi
          cd dist
          cat ./*.sha256 | sort -k2 >SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -l
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md >notes.md
          [[ -s notes.md ]] || echo "See CHANGELOG.md." >notes.md
      - name: Upload to the release
        if: needs.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body_path: notes.md
          files: dist/*
      - name: Keep the artifacts of a dry run
        if: needs.meta.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist
            notes.md

  channels:
    name: Package channels
    needs: [meta, release]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Checksums of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --pattern SHA256SUMS --dir release
          curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/v$VERSION.tar.gz" | sha256sum | cut -d' ' -f1 >release/source.sha256
          python3 scripts/update-packaging.py "$VERSION" release/SHA256SUMS \
            --source-sha256 "$(cat release/source.sha256)" --out out
      - name: AUR sverb
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: sverb
          pkgbuild: out/packaging/aur/sverb/PKGBUILD
          commit_username: sverb-release
          commit_email: release@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: sverb ${{ env.VERSION }}
      - name: AUR sverb-bin
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: sverb-bin
          pkgbuild: out/packaging/aur/sverb-bin/PKGBUILD
          commit_username: sverb-release
          commit_email: release@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: sverb-bin ${{ env.VERSION }}
      - name: Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/${{ github.repository_owner }}/homebrew-sverb.git" tap
          mkdir -p tap/Formula
          cp out/packaging/homebrew/sverb.rb tap/Formula/sverb.rb
          cd tap
          git config user.name sverb-release
          git config user.email release@users.noreply.github.com
          git add Formula/sverb.rb
          git commit -m "sverb $VERSION" && git push
      - name: Scoop bucket
        if: env.SCOOP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$SCOOP_TOKEN@github.com/${{ github.repository_owner }}/scoop-sverb.git" bucket
          mkdir -p bucket/bucket
          cp out/packaging/scoop/sverb.json bucket/bucket/sverb.json
          cd bucket
          git config user.name sverb-release
          git config user.email release@users.noreply.github.com
          git add bucket/sverb.json
          git commit -m "sverb $VERSION" && git push
