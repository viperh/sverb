[package]
name = "sverb-tui"
description = "ratatui app for sverb: views, widgets, keymap, theme"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
sync = ["dep:sverb-sync", "dep:uuid"]
# Exposes `sverb_tui::testing` (AppHarness, FakeSessionRegistry) to other crates' tests.
test-util = []
# Crash-path hooks (`SVERB_TEST_HOOK`) used by the binary's PTY tests.
test-hooks = []
# Logind `PrepareForSleep` suspend detection (zbus). Not implemented yet; the
# feature is reserved so the lock-on-suspend hook has a stable name.
suspend-detect = []

[dependencies]
sverb-conn = { workspace = true }
# Implementing the SSH connector's `HostResolver` (an `#[async_trait]`).
async-trait = { workspace = true }
sverb-core = { workspace = true }
sverb-crypto = { workspace = true }
sverb-proto = { workspace = true }
sverb-store = { workspace = true }
sverb-sync = { workspace = true, optional = true }
# Org and member ids in the sync service.
uuid = { workspace = true, optional = true }
sverb-term = { workspace = true }

# Notification timestamps in `ui.date_format`.
chrono = { workspace = true }
# Reducer, views, keymap registry, services and the interim runtime loop.
crossterm = { workspace = true }
futures = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
# `sverb keys --dump --json`.
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }
# `DelayQueue` for the timer service.
tokio-util = { workspace = true, features = ["time"] }
tracing = { workspace = true }
# OSC 52 clipboard payloads.
base64 = { workspace = true }
# Vault service (LMK/VK zeroization, the OS keyring for keyring unlock).
keyring = { workspace = true }
zeroize = { workspace = true }
# List filter (same fuzzy matcher as the search index) and the multiline
# field. `ratatui-textarea` is the ratatui-0.30 successor of `tui-textarea` (which
# only supports ratatui ≤ 0.29); keys are converted by hand, so no crossterm feature.
nucleo-matcher = { workspace = true }
ratatui-textarea = { workspace = true }
# Opening confirmed links (`services::opener`).
open = { workspace = true }

# Suspend raises SIGTSTP, which only exists on unix.
[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }
# The startup kitty-keyboard probe polls the tty with a 50 ms budget (safe
# `poll`; crossterm's own probe waits up to 2 s). Same major as crossterm's rustix.
rustix = { workspace = true }

# Reducer property tests and TestBackend snapshots.
[dev-dependencies]
insta = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
# Paused virtual time for the loop tests.
tokio = { workspace = true, features = ["test-util"] }
