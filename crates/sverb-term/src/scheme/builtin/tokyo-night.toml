# tokyo-night: built-in sverb terminal color scheme (M1-10, SPEC §7.4).
# Source: Tokyo Night (night), Folke Lemaitre, https://github.com/folke/tokyonight.nvim (Apache-2.0; palette values only).

name = "tokyo-night"

[colors]
foreground = "#c0caf5"
background = "#1a1b26"
cursor = "#c0caf5"
selection_bg = "#283457"
color0 = "#15161e"   # black
color1 = "#f7768e"   # red
color2 = "#9ece6a"   # green
color3 = "#e0af68"   # yellow
color4 = "#7aa2f7"   # blue
color5 = "#bb9af7"   # magenta
color6 = "#7dcfff"   # cyan
color7 = "#a9b1d6"   # white
color8 = "#414868"   # bright black
color9 = "#f7768e"   # bright red
color10 = "#9ece6a"  # bright green
color11 = "#e0af68"  # bright yellow
color12 = "#7aa2f7"  # bright blue
color13 = "#bb9af7"  # bright magenta
color14 = "#7dcfff"  # bright cyan
color15 = "#c0caf5"  # bright white
