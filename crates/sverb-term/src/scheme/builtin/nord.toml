# nord: built-in sverb terminal color scheme (SPEC §7.4).
# Source: Nord, Arctic Ice Studio, https://github.com/nordtheme/alacritty (MIT).

name = "nord"

[colors]
foreground = "#d8dee9"
background = "#2e3440"
cursor = "#d8dee9"
selection_bg = "#434c5e"
color0 = "#3b4252"   # black
color1 = "#bf616a"   # red
color2 = "#a3be8c"   # green
color3 = "#ebcb8b"   # yellow
color4 = "#81a1c1"   # blue
color5 = "#b48ead"   # magenta
color6 = "#88c0d0"   # cyan
color7 = "#e5e9f0"   # white
color8 = "#4c566a"   # bright black
color9 = "#bf616a"   # bright red
color10 = "#a3be8c"  # bright green
color11 = "#ebcb8b"  # bright yellow
color12 = "#81a1c1"  # bright blue
color13 = "#b48ead"  # bright magenta
color14 = "#8fbcbb"  # bright cyan
color15 = "#eceff4"  # bright white
