# monokai: built-in sverb terminal color scheme (SPEC §7.4).
# Source: Monokai, Wimer Hazenberg; base16 variant, https://github.com/chriskempson/base16 (MIT).

name = "monokai"

[colors]
foreground = "#f8f8f2"
background = "#272822"
cursor = "#f8f8f2"
selection_bg = "#49483e"
color0 = "#272822"   # black
color1 = "#f92672"   # red
color2 = "#a6e22e"   # green
color3 = "#f4bf75"   # yellow
color4 = "#66d9ef"   # blue
color5 = "#ae81ff"   # magenta
color6 = "#a1efe4"   # cyan
color7 = "#f8f8f2"   # white
color8 = "#75715e"   # bright black
color9 = "#f92672"   # bright red
color10 = "#a6e22e"  # bright green
color11 = "#f4bf75"  # bright yellow
color12 = "#66d9ef"  # bright blue
color13 = "#ae81ff"  # bright magenta
color14 = "#a1efe4"  # bright cyan
color15 = "#f9f8f5"  # bright white
