[package]
name = "sverb-server"
description = "Self-hostable sync backend for sverb (axum)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "sverb-server"
path = "src/main.rs"

# Server-side only: no client crates (core, store, conn, term, tui, sync),
# no ratatui, no crossterm, no russh, no rusqlite.
[dependencies]
sverb-crypto = { workspace = true }
sverb-proto = { workspace = true }

# M4-01: already pinned in [workspace.dependencies].
clap = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
uuid = { workspace = true }
zeroize = { workspace = true }

# M4-01: server stack (pinned in [workspace.dependencies]). sqlx-core +
# sqlx-postgres instead of the `sqlx` facade: see the comment there.
# M4-05: `ws` for /v1/ws.
axum = { workspace = true, features = ["ws"] }
axum-server = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
governor = { workspace = true }
ipnet = { workspace = true }
lettre = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
rustls = { workspace = true }
sqlx-core = { workspace = true }
sqlx-postgres = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
# M4-02: TOTP second factor (RFC 6238); secrets and otpauth URIs are built here.
totp-rs = { version = "5.7.0", default-features = false }
# M4-05: the WebSocket session is written against futures Stream/Sink.
futures = { workspace = true }

# M4-01: router tests via tower::ServiceExt::oneshot.
[dev-dependencies]
futures-core = { workspace = true }
http-body-util = { workspace = true }
# M4-02: cheap client KSF for the auth test suites (sverb_crypto::opaque).
sverb-crypto = { workspace = true, features = ["insecure-test-ksf"] }
# M4-05: a real WebSocket client for the /v1/ws end-to-end test.
tokio-tungstenite = { workspace = true }
# M4-05: paused time for the 5 s auth / 30 s heartbeat / expiry tests.
tokio = { workspace = true, features = ["test-util"] }
