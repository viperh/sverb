[package]
name = "sverb-sync"
description = "Client sync engine for sverb (HTTP + WS)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Optional for the client (feature `sync`). No ratatui, no crossterm.
[dependencies]
sverb-core = { workspace = true }
sverb-crypto = { workspace = true }
sverb-proto = { workspace = true }
sverb-store = { workspace = true }
# M4-05: the notification WebSocket client (`ws`).
fastrand = { workspace = true }
futures = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
webpki-roots = { workspace = true }
# M4-07: the engine (HTTP client, tokens, push/pull, status).
# rustls with our own `ring` ClientConfig (no aws-lc, no native-tls).
reqwest = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
parking_lot = { workspace = true }
# M4-08: id remapping of imported item bodies (account::merge_local).
ciborium = { workspace = true }
# M6-03: the share's expiry (`CreateShareResponse::expires_at`).
chrono = { workspace = true }

# M4-05: paused time for the backoff sequence test.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# M4-07: in-process sverb-server (in-memory backend) on loopback for the
# engine's integration tests; no PostgreSQL needed.
axum = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
sverb-server = { workspace = true }
tempfile = { workspace = true }
sverb-crypto = { workspace = true, features = ["insecure-test-ksf"] }
tower = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
# M6-03: the share tests run real sessions (local pty / mock) and viewer emulators.
sverb-conn = { workspace = true, features = ["test-util"] }
sverb-term = { workspace = true }
