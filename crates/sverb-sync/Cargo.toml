[package]
name = "sverb-sync"
description = "Client sync engine for sverb (HTTP + WS)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Optional for the client (feature `sync`). No ratatui, no crossterm.
[dependencies]
sverb-core = { workspace = true }
sverb-crypto = { workspace = true }
sverb-proto = { workspace = true }
sverb-store = { workspace = true }
# M4-05: the notification WebSocket client (`ws`).
fastrand = { workspace = true }
futures = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
webpki-roots = { workspace = true }
# M4-07: the engine (HTTP client, tokens, push/pull, status).
# reqwest is not in [workspace.dependencies] (the root Cargo.toml is shared);
# switch to `workspace = true` when it is added there. rustls with our own
# `ring` ClientConfig (no aws-lc, no native-tls).
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots-no-provider",
] }
serde = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
parking_lot = { workspace = true }
# M4-08: id remapping of imported item bodies (account::merge_local).
ciborium = { workspace = true }

# M4-05: paused time for the backoff sequence test.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# M4-07: in-process sverb-server (in-memory backend) on loopback for the
# engine's integration tests; no PostgreSQL needed.
axum = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
sverb-server = { workspace = true }
tempfile = "3.27.0"
sverb-crypto = { workspace = true, features = ["insecure-test-ksf"] }
tower = { workspace = true }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
