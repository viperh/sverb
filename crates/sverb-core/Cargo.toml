[package]
name = "sverb-core"
description = "Domain logic for sverb, independent of any user interface"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Keep this crate UI-agnostic: no ratatui, no crossterm, no clap.
# Everything here should be testable without a terminal. Enforced by
# crates/sverb-e2e/tests/workspace_metadata.rs.
[dependencies]
sverb-crypto = { workspace = true }
sverb-proto = { workspace = true }

# Platform base dirs and the per-SVERB_HOME Windows pipe name (paths.rs).
directories = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# config.toml model (parsing with spans, JSON schema, hot reload, key suggestions).
notify = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
strsim = { workspace = true }
toml = { workspace = true }

# Secret types (secret.rs) and logging (logging/).
parking_lot = { workspace = true }
secrecy = { workspace = true }
subtle = { workspace = true }
tracing-appender = { workspace = true }
tracing-error = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

# Item model (model/): CBOR bodies, HLC stamps, UUIDv7 ids, IDNA host validation.
ciborium = { workspace = true }
idna = { workspace = true }
uhlc = { workspace = true }
uuid = { workspace = true }

# Master-password strength (SPEC §11.2: zxcvbn score >= 3).
zxcvbn = { workspace = true }

# Fuzzy search over the in-memory index (search/).
nucleo-matcher = { workspace = true }

# known_hosts (known_hosts/): key and certificate parsing (all host-key types, CA
# signature checks), hashed host names (HMAC-SHA1), base64, random salts. ssh-key is the
# crate russh re-exports (`russh::keys`); hmac 0.13 / sha1 0.11 are already in Cargo.lock
# through it.
ssh-key = { workspace = true, features = ["std", "crypto"] }
hmac = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }

# Keychain (keychain/): key generation, import of PEM PKCS#1 / SEC1 / PKCS#8
# (encrypted PBES2 and legacy `Proc-Type: 4,ENCRYPTED` AES-128-CBC), certificates. The
# versions are the ones ssh-key 0.7 / russh already pull in (Cargo.lock).
rsa = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
sec1 = { workspace = true }
pkcs1 = { workspace = true }
pkcs8 = { workspace = true }
der = { workspace = true }
rand_core = { workspace = true }
md-5 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }

# Import / export (importers/, exporters/): RFC 4180 CSV, `Include` globs,
# zstd for the backup payload.
csv = { workspace = true }
glob = { workspace = true }
zstd = { workspace = true }

# PuTTY `.ppk` v3 key derivation (keychain/formats/ppk.rs); the Windows registry
# reader of PuTTY sessions (importers/putty_sessions.rs). winreg 0.10.1 is already in
# Cargo.lock (through another dependency).
argon2 = { workspace = true }

# Process hardening (hardening/unix.rs: prctl, setrlimit, mlock).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# PuTTY sessions in the Windows registry.
[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
# Process hardening (hardening/windows.rs: SetErrorMode, WerSetFlags, VirtualLock).
windows-sys = { workspace = true, features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
# ssh_config fixture snapshots.
insta = { workspace = true }
# T-23 hostile-input property test.
proptest = { workspace = true }
# T-10 compile-fail tests (Secret is not Clone/Serialize). serde_json is
# also a normal dependency; the dev entry keeps the test self-contained.
serde_json = { workspace = true }
trybuild = { workspace = true }

# Benches/search.rs.
criterion = { workspace = true }

# Child-process logging tests own `main` (stdout must stay empty).
[[test]]
name = "logging"
harness = false

# Index build (decrypt included) and query timing.
[[bench]]
name = "search"
harness = false

[[bench]]
name = "argon2_unlock"
harness = false
