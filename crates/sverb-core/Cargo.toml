[package]
name = "sverb-core"
description = "Domain logic for sverb, independent of any user interface"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Keep this crate UI-agnostic: no ratatui, no crossterm, no clap.
# Everything here should be testable without a terminal. Enforced by
# crates/sverb-e2e/tests/workspace_metadata.rs.
[dependencies]
sverb-crypto = { workspace = true }
sverb-proto = { workspace = true }

# M0-03: platform base dirs and the per-SVERB_HOME Windows pipe name (paths.rs).
directories = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# M0-06: config.toml model (parsing with spans, JSON schema, hot reload, key suggestions).
# notify and strsim are not in [workspace.dependencies] yet (the root Cargo.toml is
# held by another agent); switch them to `workspace = true` when merged.
notify = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
strsim = { workspace = true }
toml = { workspace = true }

# M0-04: secret types (secret.rs) and logging (logging/).
parking_lot = { workspace = true }
secrecy = { workspace = true }
subtle = { workspace = true }
tracing-appender = { workspace = true }
tracing-error = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

# M1-02: item model (model/): CBOR bodies, HLC stamps, UUIDv7 ids, IDNA host validation.
# idna is not in [workspace.dependencies] yet (the root Cargo.toml is held); switch it to
# `workspace = true` when merged.
ciborium = { workspace = true }
idna = "1.1.0"
uhlc = { workspace = true }
uuid = { workspace = true }

# M1-04: master-password strength (SPEC §11.2: zxcvbn score >= 3). zxcvbn is not in
# [workspace.dependencies] yet (the root Cargo.toml is shared); switch to
# `workspace = true` when it is added there.
zxcvbn = { version = "3.1.0", default-features = false }

# M1-05: fuzzy search over the in-memory index (search/).
nucleo-matcher = { workspace = true }

# M1-15: known_hosts (known_hosts/): key and certificate parsing (all host-key types, CA
# signature checks), hashed host names (HMAC-SHA1), base64, random salts. ssh-key is the
# crate russh re-exports (`russh::keys`); hmac 0.13 / sha1 0.11 are already in Cargo.lock
# through it (not in [workspace.dependencies] yet: the root Cargo.toml is shared).
ssh-key = { workspace = true, features = ["std", "crypto"] }
hmac = "0.13.0"
sha1 = "0.11.0"
base64 = { workspace = true }
getrandom = { workspace = true }

# M2-03: keychain (keychain/): key generation, import of PEM PKCS#1 / SEC1 / PKCS#8
# (encrypted PBES2 and legacy `Proc-Type: 4,ENCRYPTED` AES-128-CBC), certificates. The
# versions are the ones ssh-key 0.7 / russh already pull in (Cargo.lock); not in
# [workspace.dependencies] yet (the root Cargo.toml is held by another agent).
rsa = "=0.10.0-rc.18"
p256 = { version = "0.14.0", features = ["pkcs8"] }
p384 = { version = "0.14.0", features = ["pkcs8"] }
p521 = { version = "0.14.0", features = ["pkcs8"] }
sec1 = { version = "0.8.1", features = ["der", "pem", "std"] }
pkcs1 = { version = "0.8.0-rc.4", features = ["pem", "std"] }
pkcs8 = { version = "0.11.0", features = ["encryption", "pem", "std"] }
der = { version = "0.8.2", features = ["pem", "std"] }
rand_core = { workspace = true }
md-5 = "0.11.0"
aes = "0.9.3"
cbc = "0.2.1"

# M2-11: import / export (importers/, exporters/): RFC 4180 CSV, `Include` globs,
# zstd for the backup payload. csv and glob are not in [workspace.dependencies] yet (the
# root Cargo.toml is shared); switch to `workspace = true` when added there.
csv = "1.4.0"
glob = "0.3.4"
zstd = { workspace = true }

# M7-03: PuTTY `.ppk` v3 key derivation (keychain/formats/ppk.rs); the Windows registry
# reader of PuTTY sessions (importers/putty_sessions.rs). winreg 0.10.1 is already in
# Cargo.lock (through another dependency).
argon2 = { workspace = true }

# M7-03: PuTTY sessions in the Windows registry.
[target.'cfg(windows)'.dependencies]
winreg = "0.10.1"

[dev-dependencies]
pretty_assertions = { workspace = true }
# M2-11: ssh_config fixture snapshots (T-01, T-13).
insta = { workspace = true }
# M0-06: T-23 hostile-input property test.
proptest = { workspace = true }
# M0-04: T-10 compile-fail tests (Secret is not Clone/Serialize). serde_json is
# also a normal dependency (M0-06); the dev entry keeps the test self-contained.
serde_json = { workspace = true }
trybuild = { workspace = true }

# M1-05: benches/search.rs (T-12).
criterion = { workspace = true }

# M0-04: child-process logging tests own `main` (stdout must stay empty, T-12).
[[test]]
name = "logging"
harness = false

# M1-05: index build (decrypt included) and query timing (T-12).
[[bench]]
name = "search"
harness = false
