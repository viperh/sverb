[package]
name = "sverb-proto"
description = "API DTOs and sync/share wire types for sverb (serde, versioned)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Wire types only: no ratatui, no crossterm, no rusqlite, no russh.
[dependencies]
sverb-crypto = { workspace = true }
# Serde DTOs (error envelope).
serde = { workspace = true }
# CBOR encoding of ShareFrame and the share handshake payloads.
ciborium = { workspace = true }
# Auth/account/device DTOs (base64url binary fields, ids, timestamps).
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
# Audit event metadata (free-form JSON).
serde_json = { workspace = true }

# Wire-format round-trip tests.
[dev-dependencies]
serde_json = { workspace = true }
