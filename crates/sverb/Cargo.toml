[package]
name = "sverb"
description = "A terminal-native SSH client and server manager with an encrypted vault and optional self-hosted, end-to-end-encrypted sync"
# crates.io metadata (`cargo install sverb`).
readme = "../../README.md"
keywords = ["ssh", "tui", "terminal", "ratatui", "cli"]
categories = ["command-line-utilities", "network-programming"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# `panic.rs` reads CARGO_PKG_REPOSITORY at compile time for the panic message,
# so `repository` above must stay set.

[lints]
workspace = true

# `sync` is on by default. `cargo build -p sverb --no-default-features` builds
# the local-only client, with no sync code linked in (SPEC §1.1).
[features]
default = ["sync"]
sync = ["dep:sverb-sync", "dep:sverb-proto", "dep:chrono", "dep:uuid", "sverb-tui/sync"]
# Crash-path hooks (`SVERB_TEST_HOOK`) for the PTY tests in tests/panic_restore.rs.
# Never enabled in release builds.
test-hooks = ["sverb-tui/test-hooks"]

[dependencies]
sverb-core = { workspace = true }
sverb-store = { workspace = true }
sverb-sync = { workspace = true, optional = true }
# `sverb devices` (`DeviceView`, its timestamps).
sverb-proto = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
# Org ids in `sverb team`.
uuid = { workspace = true, optional = true }
# `Key32` (the LMK handed to the account flows).
sverb-crypto = { workspace = true }
sverb-tui = { workspace = true }
# `sverb forward` runs a standalone tunnel through the session manager.
sverb-conn = { workspace = true }
# `sverb agent` implements the agent's `Confirmer` on the TTY.
async-trait = { workspace = true }

# `better-panic`, `human-panic` and `libc` removed (own panic hook in panic.rs).
clap = { workspace = true }
color-eyre = { workspace = true }
# `config` and `json5` removed (config.toml lives in sverb-core::config).
crossterm = { workspace = true }
# `directories` removed; path resolution moved to sverb-core::paths.
futures = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
# `--json` output envelope.
serde_json = { workspace = true }
strip-ansi-escapes = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-error = { workspace = true }
tracing-subscriber = { workspace = true }
# `sverb unlock` / `require_unlocked` keep typed passwords in zeroizing buffers.
zeroize = { workspace = true }

# `signal-hook` removed; signal handling lives in sverb-tui (`runtime::signals`).

[build-dependencies]
anyhow = { workspace = true }
vergen-gix = { workspace = true }

[dev-dependencies]
# PTY integration tests for terminal restore after a panic.
portable-pty = { workspace = true }
# Help-output snapshots.
insta = { workspace = true }
pretty_assertions = { workspace = true }
# `export recording` tests write a real encrypted recording.
sverb-term = { workspace = true }
# `sverb forward` tests run the in-process russh server (`ssh::testing`).
sverb-conn = { workspace = true, features = ["test-util"] }

# T-01..T-05, T-10 (needs the `test-hooks` feature):
# `cargo test -p sverb --features test-hooks --test panic_restore`.
[[test]]
name = "panic_restore"
required-features = ["test-hooks"]

# startup_to_hosts_keyring (the test-only file keyring needs `test-hooks`):
# `cargo test --release -p sverb --features test-hooks --test startup -- --ignored`.
[[test]]
name = "startup"
required-features = ["test-hooks"]
